name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble and validate site archive
        run: |
          mkdir -p dist
          cat payload/*.b64 | base64 --decode > /tmp/sam-global-buy.zip
          unzip -tq /tmp/sam-global-buy.zip
          unzip -q /tmp/sam-global-buy.zip -d dist
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/database.sql
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
